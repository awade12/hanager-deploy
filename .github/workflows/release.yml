name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          ldflags="-s -w -X github.com/awade12/hanager-deploy/cli/internal/version.Version=${VERSION#v} -X github.com/awade12/hanager-deploy/cli/internal/version.Commit=${COMMIT:0:7}"
          GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$ldflags" -o hangar-${GOOS}-${GOARCH} ./cli/cmd/hangar
          GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$ldflags" -o hangar-agent-${GOOS}-${GOARCH} ./agent/cmd/hangar-agent

      - uses: actions/upload-artifact@v4
        with:
          name: hangar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            hangar-${{ matrix.goos }}-${{ matrix.goarch }}
            hangar-agent-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
